<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="robots" content="noindex,nofollow" />
    <title>登录 · Chat Demo</title>
    <link rel="stylesheet" href="/login/login.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="login-title">
        <header class="card__header">
          <span class="brand" aria-hidden="true"></span>
          <h1 id="login-title">登录 Chat Demo</h1>
          <p class="subtitle">使用你的账号继续</p>
        </header>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label class="field__label" for="username">账号</label>
            <input
              id="username"
              name="username"
              class="input"
              type="text"
              autocomplete="username"
              spellcheck="false"
              autocapitalize="off"
              required
              aria-describedby="login-error"
            />
          </div>

          <div class="field">
            <label class="field__label" for="password">密码</label>
            <input
              id="password"
              name="password"
              class="input"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="login-error"
            />
          </div>

          <p id="login-error" class="error" role="alert" aria-live="polite" hidden></p>

          <button id="submit" class="button" type="submit">
            <span class="button__label">登录</span>
            <span class="button__spinner" aria-hidden="true"></span>
          </button>
        </form>
      </section>
    </main>

    <script src="/login/login.js" defer></script>
  </body>
</html>
